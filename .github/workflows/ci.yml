name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  html-validate:
    name: Validar HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxis HTML
        run: npx --yes html-validate "**/*.html" --ignore "node_modules/**"
        continue-on-error: true

  link-check:
    name: Enlaces rotos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar enlaces internos y externos
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            './**/*.html'
          fail: false
